[[tool.uv.index]]
name = "china"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[[tool.uv.index]]
name = "pytorch"
#url = "https://download.pytorch.org/whl/cu128"
url = "https://mirrors.aliyun.com/pytorch-wheels/cu128/"
format = "flat"
explicit = true

[tool.uv.sources]
tensorrt-cu12-libs = { index = "nvidia" }
tensorrt-cu12 = { index = "nvidia" }
torch = { index = "pytorch" }
torchaudio = { index = "pytorch" }
